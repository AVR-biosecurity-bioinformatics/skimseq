pipeline:
  help: null
  slurm_account: null

input:
  samplesheet: null
  ref_genome: null
  mito_contig: null

stores:
  cram_store: output/results/cram
  gvcf_store: output/results/gvcf

  use_existing:
    cram: true
    gvcf: true

  validate_existing:
    cram: true
    gvcf: true

parallel:
  fastq_chunk_size: 10000000

  intervals:
    hc_bases_per_chunk: 100000000
    jc_genotypes_per_chunk: 100000000
    mp_bases_per_chunk: 1000000000
    filt_var_per_chunk: 10000000
    split_large_intervals: true
    min_interval_gap: 100

masks:

  min_chr_length: 50000000

  include_bed: null
  exclude_bed: null
  exclude_padding: 0

  use_reference:
    hardmasks: true
    softmasks: false

  genotype_masked_bases: false
  filter_masked_variants: true

  genmap:
    kmer_length: 100
    error_tol: 2
    threshold: 0.99

  longdust:
    kmer_length: 7
    window_size: 5000
    threshold: 0.6

  numt:
    min_length: 100
    max_gap: 1000

alignment:

  bwa_mem2:
    min_seed_length: 19
    max_seed_occurance: 250

mitochondrial:

  consensus:
    min_vaf: 0.9
    min_depth: 100

variant_calling:

  caller: bcftools

  general:
    rmdup: true
    minbq: 10
    minmq: 20

    min_fragment_length: 15
    max_fragment_length: 10000

    min_aligned_length: 30

    ploidy: 2

    output_indel: true
    output_invariant: false

  gatk:

    haplotypecaller:
      interval_padding: 100
      min_pruning: 2
      min_dangling_length: 4
      max_reads_startpos: 50

      pcr_free: false

      max_ambig_bases: 5
      use_softclipped_bases: true

    priors:
      heterozygosity: 0.001
      heterozygosity_stdev: 0.01
      indel_heterozygosity: 0.000125

    genotype_gvcfs:
      max_alternate_alleles: 6
      max_alternate_to_import: 10

  bcftools:

    mutation_rate: 0.0011

    max_depth: 250

    calling_model: cohort

    min_genotype_posterior: 0.9

vcf_filters:

  population:
    min_samples_per_pop: 1
    fail_mode: ALL

  genotype:
    qual: 0
    dp_min: 1
    dp_max: 1000

  sample:
    max_missing: 0.5

  dp_perc:
    lower: 1.0
    upper: 99.0

  qual:
    global:
      snp: 30.0
      indel: 30.0
      invariant: null

  dp_min:
    global:
      snp: 6
      indel: 6
      invariant: 6

  dist_indel:
    global:
      snp: 5
      indel: null
      invariant: null

  eh:
    global:
      snp: null
      indel: null
      invariant: null
    pop:
      snp: null
      indel: null
      invariant: null

  hwe:
    global:
      snp: null
      indel: null
      invariant: null
    pop:
      snp: null
      indel: null
      invariant: null

  maf:
    global:
      snp: 0.05
      indel: 0.05
      invariant: null
    pop:
      snp: null
      indel: null
      invariant: null

  min_samples:
    global:
      snp: 1
      indel: 1
      invariant: 1
    pop:
      snp: null
      indel: null
      invariant: null

  min_callrate:
    global:
      snp: 0.5
      indel: 0.5
      invariant: 0.5
    pop:
      snp: null
      indel: null
      invariant: null

output:
  unmapped_reads: false
  cram: true
  gvcf: true
  unfiltered_vcf: false
  beagle_gl: false

debug:
  mode: false
  rdata: false

resources:
  defaults:
    max_memory: 128.GB
    max_cpus: 16
    max_time: 240.h
    scratch: false