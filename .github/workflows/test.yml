name: Test

on:
  push:
  pull_request:

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Nextflow
        uses: nf-core/setup-nextflow@v2

      - name: Run pipeline
        run: |
          nextflow run . \
            -profile docker,test \
            -with-report report.html