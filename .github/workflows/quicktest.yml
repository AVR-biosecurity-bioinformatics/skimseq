name: quicktest

on:
  push:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Nextflow
        uses: nf-core/setup-nextflow@v2

      - name: Run test
        run: |
          nextflow run . \
            -profile test,docker \
            -ansi-log false